#
# E2E test overlay. Adds a Playwright container that runs tests against
# the gateway over the internal Docker network — no host port mapping needed.
#
# Usage: task test:e2e

services:
  postgres:
    environment:
      POSTGRES_DB: holomush_test

  core:
    command: ["core", "--log-format", "text", "--grpc-addr", "0.0.0.0:9000", "--metrics-addr", "0.0.0.0:9100", "--auto-gen-kek"]
    environment:
      DATABASE_URL: postgres://holomush:holomush@postgres:5432/holomush_test?sslmode=disable
      # KEK is required to boot. --auto-gen-kek mints a fresh ephemeral keyfile
      # each E2E run (the container is recreated); a fixed test passphrase is
      # sufficient because the keyfile does not leave the container.
      HOLOMUSH_KEK_FILE: /home/holomush/.config/holomush/certs/master.key.enc
      HOLOMUSH_KEK_PASSPHRASE: e2e-test-passphrase
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9100/healthz/readiness || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  gateway:
    ports: !reset []
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15

  playwright:
    image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
    working_dir: /work
    volumes:
      - ./web:/work
    environment:
      PLAYWRIGHT_BASE_URL: http://gateway:8080
      E2E_DATABASE_URL: postgres://holomush:holomush@postgres:5432/holomush_test?sslmode=disable
      # Forward the runner's CI flag INTO the container. Without this,
      # `process.env.CI` is undefined inside the playwright image and every
      # CI-widened timeout silently takes its LOCAL branch on CI hardware:
      #   playwright.config.ts:18  per-test timeout  60s -> 30s
      #   terminal.spec.ts:25      RECONNECT_TIMEOUT 30s -> 10s
      #   terminal.spec.ts:26      RECONNECT_POLL    15s ->  5s
      #   terminal.spec.ts:27      RECONNECT_TEST   150s -> 60s
      #   scenes.spec.ts:579       output-match wait  30s -> 10s
      # Each of those widenings was added in response to a documented flake
      # (holomush-mwmzt, holomush-hjk6x) and none had ever taken effect — the
      # 10000ms timeout in PR #4874's E2E failure is the 10s local branch, not
      # the 30s the call site asks for on CI. Empty default so a local run
      # (where CI is unset) keeps the shorter, faster budgets.
      CI: ${CI:-}
    networks:
      - frontend
      - backend
    depends_on:
      gateway:
        condition: service_healthy
    profiles: ["test"]
