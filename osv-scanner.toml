# OSV-Scanner allowlist — suppresses OSV-Scanner (`scan source`) findings ONLY.
#
# Scope & policy (see Taskfile.yaml `lint:vuln` and 06-03-SUMMARY):
#   - This allowlist applies to the OSV-Scanner leg of `task lint:vuln` ONLY.
#     govulncheck has NO finding-suppression mechanism (golang/go#59507), so any
#     REACHABLE Go vuln it reports is a HARD STOP — remediate (bump/patch), never
#     suppress. Do not expect this file to silence govulncheck.
#   - The nats-server CVE (GHSA-q59r-vq66-pxc2 / CVE-2026-58207) is intentionally
#     NOT allowlisted; it is remediated by bumping nats-server/v2 to >= v2.14.3
#     AND caught by the deterministic cmd/nats-floor-guard leg of lint:vuln (that
#     advisory is a git-range-only OSV record no manifest scanner can flag).
#
# Every entry MUST carry id + reason + ignoreUntil EXPIRY — a suppression cannot
# live forever; the expiry forces periodic re-review.
#
# ── Currently allowlisted: NOTHING ──
# This file intentionally carries zero [[IgnoredVulns]] entries. The OSV-Scanner
# leg of `task lint:vuln` is green with no suppressions at all.
#
# History: five test-only github.com/docker/docker advisories (enumerated in
# holomush#4817 — deliberately NOT repeated here, so a text search for those ids
# in this file stays a usable "is it suppressed?" check) were allowlisted while
# docker/docker was an indirect dep reached via
# internal/store → golang-migrate/migrate/v4 (pgx/v5
# test harness) → dhui/dktest → docker/docker. Phase 01.1 replaced golang-migrate
# with pressly/goose, which took the dktest chain with it:
# `go mod why -m github.com/docker/docker` now reports "(main module does not
# need module github.com/docker/docker)" and `go mod graph` has zero edges to it.
# The suppressions' stated cause is gone, so they were retired (holomush#4817).
# A suppression that outlives its cause is dead config that silently covers a
# future reintroduction of the same package — do not re-add one without a live,
# named requirer.
