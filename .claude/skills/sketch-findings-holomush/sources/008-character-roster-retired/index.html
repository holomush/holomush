<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch 008 — Character Roster with Retired</title>
    <link rel="stylesheet" href="../themes/default.css" />
    <style>
      body { padding-top: 42px; }

      #variant-nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9998; height: 42px;
        display: flex; align-items: center; gap: 6px; padding: 0 12px;
        background: #07080a; border-bottom: 1px solid var(--color-border);
      }
      #variant-nav .lbl { font-family: var(--font-mono); font-size: 10.5px; color: var(--color-status-text); margin-right: 6px; }
      .variant-tab {
        height: 26px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--color-border);
        background: transparent; color: var(--color-muted-foreground); font-family: inherit; font-size: 12px; cursor: pointer;
      }
      .variant-tab:hover { background: var(--color-secondary); color: var(--color-foreground); }
      .variant-tab.active {
        background: color-mix(in srgb, var(--color-primary) 14%, transparent);
        border-color: color-mix(in srgb, var(--color-primary) 45%, transparent); color: var(--color-primary);
      }
      .statepick {
        height: 26px; border-radius: 5px; border: 1px solid var(--color-border); background: #101418;
        color: var(--color-muted-foreground); font-family: inherit; font-size: 11.5px; padding: 0 6px;
      }
      #sketch-tools {
        position: fixed; right: 10px; bottom: 10px; z-index: 9999; opacity: .35; transition: opacity 120ms;
        display: flex; align-items: center; gap: 4px; padding: 5px 7px; border-radius: 7px;
        background: #07080a; border: 1px solid var(--color-border);
      }
      #sketch-tools button {
        height: 22px; padding: 0 7px; border-radius: 4px; font-size: 11px; border: 1px solid var(--color-border);
        background: transparent; color: var(--color-muted-foreground); cursor: pointer;
      }
      #sketch-tools button.on { color: var(--color-primary); border-color: var(--color-primary); }
      #sketch-tools .sep { width: 1px; height: 16px; background: var(--color-border); }
      #sketch-tools select { height: 22px; border-radius: 4px; border: 1px solid var(--color-border); background: #101418; color: var(--color-muted-foreground); font-size: 11px; }

      .viewport-wrap {
        margin: 0 auto; transition: max-width 180ms ease; container-type: inline-size; container-name: vp;
        border: 1px solid var(--color-border); border-top: none;
      }
      .shell { height: calc(100vh - 42px - var(--topbar-h)); display: flex; min-height: 0; }
      .rail {
        width: var(--rail-w); flex-shrink: 0; background: var(--color-sidebar-background);
        border-right: 1px solid var(--color-border); display: flex; flex-direction: column;
        align-items: center; padding: 7px 0; gap: 4px;
      }
      .rail-btn {
        width: 34px; height: 34px; border-radius: 7px; border: none; background: transparent;
        color: var(--color-muted-foreground); display: flex; align-items: center; justify-content: center;
        cursor: pointer; position: relative;
      }
      .rail-btn.is-active { color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 12%, transparent); }
      .rail-btn.is-active::before {
        content: ''; position: absolute; left: -7px; top: 8px; bottom: 8px; width: 2px;
        border-radius: 2px; background: var(--color-primary);
      }
      .main { flex: 1; min-width: 0; overflow: auto; }
      .page { padding: 18px 20px 44px; }
      .page h1 { font-size: 18px; font-weight: 600; margin: 0 0 3px; }
      .sub { font-size: 12px; color: var(--color-status-text); margin-bottom: 16px; }

      /* ---- the existing idiom: Card grid (authed)/characters/+page.svelte -- */
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 11px; }
      .ccard {
        border: 1px solid var(--color-border); border-radius: 9px; background: var(--color-card);
        padding: 14px; display: flex; gap: 11px; align-items: flex-start;
        cursor: pointer; transition: border-color 120ms, background 120ms;
      }
      .ccard:hover { border-color: var(--color-primary); }
      .ccard.dashed { border-style: dashed; }
      .cavatar {
        width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0; display: flex;
        align-items: center; justify-content: center; font-size: 20px; font-weight: 700;
        background: var(--color-primary); color: var(--color-primary-foreground);
      }
      .cbody { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .cname { font-size: 13.5px; font-weight: 600; }
      .cmeta { font-size: 11.5px; color: var(--color-status-text); }
      .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .badge {
        display: inline-flex; align-items: center; height: 17px; padding: 0 6px; border-radius: 4px;
        font-size: 10px; border: 1px solid var(--color-border); color: var(--color-muted-foreground);
      }
      .badge.session { background: color-mix(in srgb, var(--color-primary) 16%, transparent); border-color: transparent; color: var(--color-primary); }
      .badge.life-retired { color: var(--color-status-text); }
      .badge.life-idle { color: var(--color-status-text); opacity: .7; }

      /* unselectable */
      .ccard.locked { cursor: not-allowed; opacity: .58; background: transparent; }
      .ccard.locked:hover { border-color: var(--color-border); }
      .ccard.locked .cavatar { background: var(--color-secondary); color: var(--color-status-text); }
      .reason { font-size: 10.5px; color: var(--color-status-text); margin-top: 5px; line-height: 1.5; }
      .viewlink {
        font-size: 11px; color: var(--color-primary); background: none; border: none; padding: 0;
        cursor: pointer; font-family: inherit; text-align: left; margin-top: 5px;
      }

      /* B: sectioned */
      .sechead {
        display: flex; align-items: center; gap: 8px; margin: 26px 0 9px;
        font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--color-status-text);
      }
      .sechead:first-of-type { margin-top: 0; }
      .sechead .rule { flex: 1; height: 1px; background: var(--color-border); }
      .disclose {
        display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none;
        border: 1px solid var(--color-border); border-radius: 5px; padding: 2px 8px;
        font-size: 10.5px; color: var(--color-muted-foreground); text-transform: none; letter-spacing: 0;
      }

      /* C: dense list, following admin (002) */
      table.roster { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      table.roster th {
        text-align: left; font-weight: 500; font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase;
        color: var(--color-status-text); border-bottom: 1px solid var(--color-border); padding: 7px 9px;
      }
      table.roster td { border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent); padding: 9px 9px; }
      table.roster tbody tr { cursor: pointer; }
      table.roster tbody tr:hover { background: color-mix(in srgb, var(--color-primary) 5%, transparent); }
      table.roster tbody tr.locked { cursor: not-allowed; opacity: .55; }
      table.roster tbody tr.locked:hover { background: transparent; }
      .rname { display: flex; align-items: center; gap: 9px; }
      .ravatar {
        width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center;
        justify-content: center; font-size: 12px; font-weight: 700;
        background: var(--color-primary); color: var(--color-primary-foreground);
      }
      tr.locked .ravatar { background: var(--color-secondary); color: var(--color-status-text); }

      .note {
        margin: 0 0 16px; padding: 9px 12px; border-radius: 7px; font-size: 11.5px; line-height: 1.65;
        border: 1px dashed color-mix(in srgb, var(--color-primary) 35%, transparent);
        background: color-mix(in srgb, var(--color-primary) 6%, transparent); color: var(--color-muted-foreground);
      }
      .note.warn {
        border-color: color-mix(in srgb, var(--color-destructive) 45%, transparent);
        background: color-mix(in srgb, var(--color-destructive) 8%, transparent);
      }
      .note code { font-family: var(--font-mono); font-size: 11px; }
      .muted { color: var(--color-status-text); }
      .empty { text-align: center; padding: 50px 20px; }
      .empty h2 { font-size: 15px; margin: 0 0 5px; }
      .empty p { font-size: 12.5px; color: var(--color-status-text); margin: 0 0 14px; }
      .btn {
        height: 30px; padding: 0 13px; border-radius: 6px; border: 1px solid var(--color-border);
        background: var(--color-surface); color: var(--color-muted-foreground);
        font-size: 12.5px; cursor: pointer; font-family: inherit;
      }
      .btn-primary {
        background: color-mix(in srgb, var(--color-primary) 16%, transparent);
        border-color: color-mix(in srgb, var(--color-primary) 50%, transparent); color: var(--color-primary);
      }
      @container vp (max-width: 767px) {
        .shell > .rail { width: 0; border-right-width: 0; overflow: hidden; }
        .grid { grid-template-columns: 1fr; }
        table.roster th:nth-child(3), table.roster td:nth-child(3) { display: none; }
      }
    </style>
  </head>
  <body>
    <svg style="display: none">
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /></symbol>
      <symbol id="i-clap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 14 6-6 8 8-6 6z" /><path d="m14 4 6 6" /></symbol>
      <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></symbol>
    </svg>

    <div id="variant-nav">
      <span class="lbl">SKETCH 008 · character roster · retired</span>
      <button class="variant-tab active" onclick="showVariant('a', this)">A: One grid, in place</button>
      <button class="variant-tab" onclick="showVariant('b', this)">B: Sectioned ★</button>
      <button class="variant-tab" onclick="showVariant('c', this)">C: Dense list</button>
      <span style="flex: 1"></span>
      <select class="statepick" id="datapick" onchange="render()">
        <option value="mixed">roster: 3 active · 2 retired · 1 idle</option>
        <option value="allretired">roster: all retired</option>
        <option value="one">roster: single character</option>
        <option value="zero">roster: zero (new player)</option>
      </select>
      <select class="statepick" id="sesspick" onchange="render()">
        <option value="show">session badge: shown (today)</option>
        <option value="hide">session badge: dropped</option>
      </select>
    </div>

    <div class="viewport-wrap" id="vp">
      <div class="topbar" style="height: var(--topbar-h); display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--color-border); background: var(--color-surface)">
        <span style="font-family: var(--font-mono); font-weight: 600">&gt;holomush<span style="color: var(--color-cursor)">_</span></span>
        <span class="muted" style="font-size: 12px">/ characters</span>
      </div>
      <div class="shell">
        <nav class="rail">
          <button class="rail-btn" title="Room"><svg width="18" height="18"><use href="#i-home" /></svg></button>
          <button class="rail-btn" title="Scenes"><svg width="18" height="18"><use href="#i-clap" /></svg></button>
          <button class="rail-btn is-active" title="Characters"><svg width="18" height="18"><use href="#i-users" /></svg></button>
        </nav>
        <div class="main"><div class="page" id="page"></div></div>
      </div>
    </div>

    <div id="sketch-tools" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.35'">
      <select onchange="document.querySelector('link[href*=themes]').href = '../themes/' + this.value + '.css'">
        <option value="default">Default</option>
      </select>
      <span class="sep"></span>
      <button onclick="setVp(375, this)">375</button>
      <button onclick="setVp(768, this)">768</button>
      <button class="on" onclick="setVp(0, this)">Full</button>
    </div>

    <script>
      // `lifecycle` is Phase 2's `characters.status` (active | retired | idle).
      // `session` is the EXISTING badge on (authed)/characters/+page.svelte, which
      // reads `hasActiveSession` / `sessionStatus`. They are DIFFERENT vocabularies
      // and this sketch shows both on purpose — see the README.
      const ALL = [
        { n: 'Ashwood, Mirén', life: 'active', session: 'Active', played: '2026-07-28', at: 'The West Stacks' },
        { n: 'Cael Vantrys', life: 'active', session: 'Offline', played: '2026-06-02', at: 'Harbourside' },
        { n: 'Teodor Ash', life: 'active', session: 'Offline', played: '2026-05-19', at: null },
        { n: 'Hollow', life: 'retired', session: 'Offline', played: '2025-11-04', at: null },
        { n: 'Wren Calloway', life: 'retired', session: 'Offline', played: '2025-08-30', at: null },
        { n: 'Sable Quint', life: 'idle', session: 'Offline', played: '2025-09-22', at: null },
      ];

      let VARIANT = 'a';

      function rosterFor(k) {
        if (k === 'allretired') return ALL.map((c) => ({ ...c, life: 'retired' }));
        if (k === 'one') return [ALL[0]];
        if (k === 'zero') return [];
        return ALL;
      }
      const locked = (c) => c.life !== 'active';
      const reasonFor = (c) =>
        c.life === 'retired'
          ? 'Retired — cannot be played. Their profile still resolves, and the name stays reserved.'
          : 'Idle — system-invoked on inactivity. Not reachable in v0.13.';

      function badges(c, showSession) {
        let b = '';
        if (c.life === 'retired') b += '<span class="badge life-retired">Retired</span>';
        if (c.life === 'idle') b += '<span class="badge life-idle">⊘ Idle</span>';
        if (showSession) {
          b +=
            c.session === 'Active'
              ? '<span class="badge session">Active</span>'
              : '<span class="badge">' + c.session + '</span>';
        }
        return b ? '<div class="badges">' + b + '</div>' : '';
      }

      function cardHtml(c, showSession) {
        const lk = locked(c);
        return (
          '<div class="ccard' + (lk ? ' locked' : '') + '">' +
          '<div class="cavatar">' + c.n.charAt(0) + '</div>' +
          '<div class="cbody"><span class="cname">' + c.n + '</span>' +
          '<span class="cmeta">Last played: ' + c.played + '</span>' +
          (c.at && !lk ? '<span class="cmeta">At: ' + c.at + '</span>' : '') +
          badges(c, showSession) +
          (lk ? '<div class="reason">' + reasonFor(c) + '</div><button class="viewlink">View profile →</button>' : '') +
          '</div></div>'
        );
      }

      function createCard() {
        return (
          '<div class="ccard dashed"><div class="cavatar" style="background:var(--color-secondary);color:var(--color-status-text)">' +
          '<svg width="20" height="20"><use href="#i-plus"/></svg></div>' +
          '<div class="cbody"><span class="cname">Create New Character</span>' +
          '<span class="cmeta">Names are reserved once taken.</span></div></div>'
        );
      }

      function rowHtml(c, showSession) {
        const lk = locked(c);
        return (
          '<tr class="' + (lk ? 'locked' : '') + '">' +
          '<td><div class="rname"><div class="ravatar">' + c.n.charAt(0) + '</div><span style="font-weight:600">' + c.n + '</span></div></td>' +
          '<td>' +
          (c.life === 'active' ? '<span class="badge">Active</span>' : '') +
          (c.life === 'retired' ? '<span class="badge life-retired">Retired</span>' : '') +
          (c.life === 'idle' ? '<span class="badge life-idle">⊘ Idle</span>' : '') +
          (showSession && c.session === 'Active' ? ' <span class="badge session">Online</span>' : '') +
          '</td>' +
          '<td class="muted">' + c.played + '</td>' +
          '<td style="text-align:right">' +
          (lk ? '<button class="viewlink">View profile →</button>' : '<button class="btn" style="height:26px;font-size:11.5px">Play</button>') +
          '</td></tr>'
        );
      }

      function render() {
        const key = document.getElementById('datapick').value;
        const showSession = document.getElementById('sesspick').value === 'show';
        const list = rosterFor(key);
        const act = list.filter((c) => !locked(c));
        const ret = list.filter(locked);

        let note =
          '<b>Two different “status” vocabularies are on this screen.</b> ' +
          '<code>Retired</code>/<code>Idle</code> are Phase 2’s <code>characters.status</code> — a <b>lifecycle</b>. ' +
          '<code>Active</code>/<code>Offline</code> is the badge the roster <i>already ships</i> today ' +
          '(<code>hasActiveSession</code>), which is a <b>session</b>. Flip <i>session badge</i> off to see the screen without the collision.';
        if (showSession && ret.length) {
          note +=
            '<br><br><b class="mono">Look at a retired card with the session badge on:</b> it reads ' +
            '“Retired · Offline”. <b>“Offline” is meaningless on a character who cannot be played at all</b> — it is not ' +
            'informative, it is a second status competing with the first.';
        }
        if (key === 'zero') note = 'Zero characters — the new-player state. There is no roster to design here, only an invitation.';
        if (key === 'allretired')
          note =
            '<b>Every character retired.</b> This is the state that separates the variants hardest: ' +
            'the grid is now entirely un-clickable. Does the page still tell you what to do?';

        let body;
        if (!list.length) {
          body =
            '<div class="empty"><h2>No characters yet</h2>' +
            '<p>Create your first character to enter the game.</p>' +
            '<button class="btn btn-primary">Create character</button></div>';
        } else if (VARIANT === 'c') {
          body =
            '<table class="roster"><thead><tr><th>Character</th><th>Status</th><th>Last played</th><th></th></tr></thead><tbody>' +
            list.map((c) => rowHtml(c, showSession)).join('') +
            '</tbody></table>' +
            '<div style="margin-top:14px"><button class="btn btn-primary">+ Create character</button></div>';
        } else if (VARIANT === 'b') {
          body =
            (act.length
              ? '<div class="sechead">Playable <span class="rule"></span></div><div class="grid">' +
                act.map((c) => cardHtml(c, showSession)).join('') + createCard() + '</div>'
              : '<div class="sechead">Playable <span class="rule"></span></div>' +
                '<div class="grid">' + createCard() + '</div>' +
                '<p class="muted" style="font-size:12px;margin-top:10px">None of your characters can be played right now.</p>') +
            (ret.length
              ? '<div class="sechead">Not playable <span class="rule"></span>' +
                '<span class="disclose">' + ret.length + ' hidden <svg width="9" height="9"><use href="#i-chev"/></svg></span></div>' +
                '<div class="grid">' + ret.map((c) => cardHtml(c, showSession)).join('') + '</div>'
              : '');
        } else {
          body = '<div class="grid">' + list.map((c) => cardHtml(c, showSession)).join('') + createCard() + '</div>';
        }

        document.getElementById('page').innerHTML =
          '<h1>Your characters</h1><div class="sub">' + list.length + ' character' + (list.length === 1 ? '' : 's') +
          (ret.length ? ' · ' + ret.length + ' not playable' : '') + '</div>' +
          '<div class="note' + (showSession && ret.length ? ' warn' : '') + '">' + note + '</div>' + body;
      }

      function showVariant(v, btn) {
        VARIANT = v;
        document.querySelectorAll('.variant-tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      }
      function setVp(px, btn) {
        document.querySelectorAll('#sketch-tools button').forEach((b) => b.classList.remove('on'));
        btn.classList.add('on');
        document.getElementById('vp').style.maxWidth = px ? px + 'px' : '';
      }
      render();
    </script>
  </body>
</html>
