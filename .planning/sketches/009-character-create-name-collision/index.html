<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch 009 — Character Create &amp; Name Collision</title>
    <link rel="stylesheet" href="../themes/default.css" />
    <style>
      body { padding-top: 42px; }

      #variant-nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9998; height: 42px;
        display: flex; align-items: center; gap: 6px; padding: 0 12px;
        background: #07080a; border-bottom: 1px solid var(--color-border);
      }
      #variant-nav .lbl { font-family: var(--font-mono); font-size: 10.5px; color: var(--color-status-text); margin-right: 6px; }
      .variant-tab {
        height: 26px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--color-border);
        background: transparent; color: var(--color-muted-foreground); font-family: inherit; font-size: 12px; cursor: pointer;
      }
      .variant-tab:hover { background: var(--color-secondary); color: var(--color-foreground); }
      .variant-tab.active {
        background: color-mix(in srgb, var(--color-primary) 14%, transparent);
        border-color: color-mix(in srgb, var(--color-primary) 45%, transparent); color: var(--color-primary);
      }
      .statepick {
        height: 26px; border-radius: 5px; border: 1px solid var(--color-border); background: #101418;
        color: var(--color-muted-foreground); font-family: inherit; font-size: 11.5px; padding: 0 6px; max-width: 300px;
      }
      #sketch-tools {
        position: fixed; right: 10px; bottom: 10px; z-index: 9999; opacity: .35; transition: opacity 120ms;
        display: flex; align-items: center; gap: 4px; padding: 5px 7px; border-radius: 7px;
        background: #07080a; border: 1px solid var(--color-border);
      }
      #sketch-tools button {
        height: 22px; padding: 0 7px; border-radius: 4px; font-size: 11px; border: 1px solid var(--color-border);
        background: transparent; color: var(--color-muted-foreground); cursor: pointer;
      }
      #sketch-tools button.on { color: var(--color-primary); border-color: var(--color-primary); }
      #sketch-tools .sep { width: 1px; height: 16px; background: var(--color-border); }
      #sketch-tools select { height: 22px; border-radius: 4px; border: 1px solid var(--color-border); background: #101418; color: var(--color-muted-foreground); font-size: 11px; }

      .stage { max-width: 1060px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(340px, 1fr) minmax(300px, 380px); gap: 16px; align-items: start; }
      @media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }

      .panel { border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-background); overflow: hidden; }
      .panelhead {
        padding: 8px 12px; font-size: 11px; font-family: var(--font-mono); color: var(--color-status-text);
        background: #07080a; border-bottom: 1px solid var(--color-border);
      }
      .panelbody { padding: 16px; }

      .ccard { border: 1px solid var(--color-border); border-radius: 9px; background: var(--color-card); padding: 15px; border-style: dashed; }
      .cardtop { display: flex; gap: 11px; align-items: center; margin-bottom: 12px; }
      .cavatar {
        width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center;
        justify-content: center; font-size: 20px; font-weight: 700;
        background: var(--color-secondary); color: var(--color-status-text);
      }
      .cavatar.live { background: var(--color-primary); color: var(--color-primary-foreground); }
      .cname { font-size: 13.5px; font-weight: 600; }
      .cmeta { font-size: 11.5px; color: var(--color-status-text); }

      label.fl { display: block; font-size: 11px; color: var(--color-status-text); margin-bottom: 4px; }
      input.name {
        width: 100%; background: var(--color-input-background); color: var(--color-input-text);
        border: 1px solid var(--color-input); border-radius: 6px; padding: 8px 10px;
        font-size: 14px; font-family: inherit;
      }
      input.name.err { border-color: var(--color-destructive); }
      input.name.ok { border-color: color-mix(in srgb, #7fd98f 55%, transparent); }

      .msg { margin-top: 8px; font-size: 12px; line-height: 1.6; display: flex; gap: 7px; align-items: flex-start; }
      .msg.bad { color: var(--color-destructive); }
      .msg.good { color: #7fd98f; }
      .msg.info { color: var(--color-muted-foreground); }
      .msg svg { flex-shrink: 0; margin-top: 2px; }

      .echo {
        margin-top: 9px; padding: 9px 11px; border-radius: 7px; font-size: 12px; line-height: 1.6;
        background: var(--color-card); border: 1px solid var(--color-border); color: var(--color-muted-foreground);
      }
      .echo b { color: var(--color-foreground); }
      .echo .k { font-family: var(--font-mono); font-size: 11px; color: var(--color-status-text); }

      .chk { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--color-muted-foreground); cursor: pointer; line-height: 1.5; }
      .chk input { margin-top: 2px; }

      .btnrow { display: flex; gap: 8px; margin-top: 14px; }
      .btn {
        height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--color-border);
        background: var(--color-surface); color: var(--color-muted-foreground);
        font-size: 12.5px; cursor: pointer; font-family: inherit;
      }
      .btn-primary {
        background: color-mix(in srgb, var(--color-primary) 16%, transparent);
        border-color: color-mix(in srgb, var(--color-primary) 50%, transparent); color: var(--color-primary);
      }
      .btn[disabled], .btn-primary[disabled] { opacity: .4; cursor: not-allowed; }

      /* pipeline visualiser */
      .pipe { font-size: 11.5px; }
      .step { display: flex; gap: 9px; padding: 7px 0; border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent); }
      .step:last-child { border-bottom: none; }
      .stepno {
        width: 17px; height: 17px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center;
        justify-content: center; font-size: 9.5px; font-weight: 700;
        background: var(--color-secondary); color: var(--color-status-text);
      }
      .step.fired .stepno { background: var(--color-primary); color: var(--color-primary-foreground); }
      .step.rejected .stepno { background: var(--color-destructive); color: #04222e; }
      .stepbody { min-width: 0; }
      .stepname { font-weight: 600; color: var(--color-muted-foreground); }
      .step.fired .stepname, .step.rejected .stepname { color: var(--color-foreground); }
      .stepval { font-family: var(--font-mono); font-size: 11px; color: var(--color-status-text); word-break: break-all; margin-top: 2px; }
      .stepval em { color: var(--color-primary); font-style: normal; }

      .note {
        margin: 0 16px 0; padding: 9px 12px; border-radius: 7px; font-size: 11.5px; line-height: 1.65;
        border: 1px dashed color-mix(in srgb, var(--color-primary) 35%, transparent);
        background: color-mix(in srgb, var(--color-primary) 6%, transparent); color: var(--color-muted-foreground);
      }
      .note.warn { border-color: color-mix(in srgb, var(--color-destructive) 45%, transparent); background: color-mix(in srgb, var(--color-destructive) 8%, transparent); }
      .note code { font-family: var(--font-mono); font-size: 11px; }
      .muted { color: var(--color-status-text); }
      .existing { font-size: 11.5px; color: var(--color-status-text); margin-top: 10px; line-height: 1.7; }
      .existing b { color: var(--color-muted-foreground); }
    </style>
  </head>
  <body>
    <svg style="display: none">
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6M9 9l6 6" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></symbol>
    </svg>

    <div id="variant-nav">
      <span class="lbl">SKETCH 009 · create &amp; name collision</span>
      <button class="variant-tab active" onclick="showVariant('a', this)">A: Submit &amp; report ★</button>
      <button class="variant-tab" onclick="showVariant('b', this)">B: Live echo + availability</button>
      <button class="variant-tab" onclick="showVariant('c', this)">C: Two-step confirm</button>
      <span style="flex: 1"></span>
      <select class="statepick" id="casepick" onchange="render()"></select>
    </div>

    <div class="note" id="topnote"></div>

    <div class="stage">
      <div class="panel">
        <div class="panelhead">/characters · create</div>
        <div class="panelbody" id="form"></div>
      </div>
      <div class="panel">
        <div class="panelhead">§6.1 pipeline — what the server does</div>
        <div class="panelbody"><div class="pipe" id="pipe"></div>
          <div class="existing">
            <b>Existing characters (this game):</b><br />
            Ashwood, Mirén · Cael Vantrys · Hollow
          </div>
        </div>
      </div>
    </div>

    <div id="sketch-tools" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.35'">
      <select onchange="document.querySelector('link[href*=themes]').href = '../themes/' + this.value + '.css'">
        <option value="default">Default</option>
      </select>
    </div>

    <script>
      // Each case is a submission and the verdict §6.1 gives it. The pipeline is
      // NFKC -> strip Cf -> whitespace canon -> case-fold (key only), then
      // mixed-script (UTS#39 Moderately Restrictive), then skeleton, then the
      // UNIQUE index on the normalized key.
      const CASES = [
        {
          id: 'clean', label: 'clean name — accepted',
          input: 'Teodor Ash',
          display: 'Teodor Ash', key: 'teodor ash',
          steps: { nfkc: 'Teodor Ash', cf: 'Teodor Ash', ws: 'Teodor Ash', fold: 'teodor ash' },
          verdict: 'ok',
        },
        {
          id: 'ws', label: 'stray whitespace — silently canonicalized',
          input: '  Teodor   Ash ',
          display: 'Teodor Ash', key: 'teodor ash',
          steps: { nfkc: '␣␣Teodor␣␣␣Ash␣', cf: '␣␣Teodor␣␣␣Ash␣', ws: 'Teodor Ash', fold: 'teodor ash' },
          verdict: 'ok', changed: true,
        },
        {
          id: 'nfkc', label: 'fullwidth + ligature — NFKC rewrites it',
          input: 'Ｔeodor Aﬂame',
          display: 'Teodor Aflame', key: 'teodor aflame',
          steps: { nfkc: 'Teodor Aflame', cf: 'Teodor Aflame', ws: 'Teodor Aflame', fold: 'teodor aflame' },
          verdict: 'ok', changed: true,
        },
        {
          id: 'zwj', label: 'zero-width joiners — stripped, name survives',
          input: 'Ho\u200Dll\u200Dow\u00ADs', // ZWJ, ZWJ, SHY — invisible in source, so escaped
          display: 'Hollows', key: 'hollows',
          steps: { nfkc: 'Ho<ZWJ>ll<ZWJ>ow<SHY>s', cf: 'Hollows', ws: 'Hollows', fold: 'hollows' },
          verdict: 'ok', changed: true,
        },
        {
          id: 'empty', label: 'only invisibles — normalizes to empty, REJECTED',
          input: '\u200C\u200D\u200B', // ZWNJ + ZWJ + ZWSP — nothing visible at all
          display: '', key: '',
          steps: { nfkc: '<ZWNJ><ZWJ><ZWSP>', cf: '(empty)', ws: '(empty)', fold: '(empty)' },
          verdict: 'empty',
        },
        {
          id: 'taken', label: 'case variant of an existing name — UNIQUE violation',
          input: 'ASHWOOD, MIRÉN',
          display: 'ASHWOOD, MIRÉN', key: 'ashwood, mirén',
          steps: { nfkc: 'ASHWOOD, MIRÉN', cf: 'ASHWOOD, MIRÉN', ws: 'ASHWOOD, MIRÉN', fold: 'ashwood, mirén' },
          verdict: 'taken',
        },
        {
          id: 'mixed', label: 'Latin + Cyrillic splice — mixed-script REJECTED',
          input: 'Аshwood, Mirén',
          display: 'Аshwood, Mirén', key: 'аshwood, mirén',
          steps: { nfkc: 'Аshwood, Mirén', cf: 'Аshwood, Mirén', ws: 'Аshwood, Mirén', fold: 'аshwood, mirén' },
          verdict: 'mixed',
        },
        {
          id: 'skeleton', label: 'whole-script confusable — skeleton REJECTED',
          input: 'Ноllоw',
          display: 'Ноllоw', key: 'ноllоw',
          steps: { nfkc: 'Ноllоw', cf: 'Ноllоw', ws: 'Ноllоw', fold: 'ноllоw' },
          verdict: 'skeleton',
        },
        {
          id: 'race', label: 'B only — “available”, then lost the insert',
          input: 'Wren Calloway',
          display: 'Wren Calloway', key: 'wren calloway',
          steps: { nfkc: 'Wren Calloway', cf: 'Wren Calloway', ws: 'Wren Calloway', fold: 'wren calloway' },
          verdict: 'race',
        },
      ];

      let VARIANT = 'a';

      const sel = document.getElementById('casepick');
      sel.innerHTML = CASES.map((c) => '<option value="' + c.id + '">' + c.label + '</option>').join('');

      const VERDICT = {
        ok: { cls: 'good', icon: 'i-check', text: 'Available.' },
        empty: {
          cls: 'bad', icon: 'i-x',
          text: 'That name is empty once invisible characters are removed. Please enter a name with visible letters.',
        },
        taken: {
          cls: 'bad', icon: 'i-x',
          text: 'That name is already taken. Names are compared without regard to capitalization.',
        },
        mixed: {
          cls: 'bad', icon: 'i-x',
          text: 'That name mixes Latin and Cyrillic letters. Please use a single script — many mixed-script names are indistinguishable from other players’ names.',
        },
        skeleton: {
          cls: 'bad', icon: 'i-x',
          text: 'That name is too easily confused with an existing character’s name. Please choose a different one.',
        },
        race: {
          cls: 'bad', icon: 'i-x',
          text: 'That name was taken a moment ago. Someone created it while you were typing — please choose another.',
        },
      };

      function currentCase() {
        return CASES.find((c) => c.id === sel.value) || CASES[0];
      }

      function pipeHtml(c) {
        const rejectAt =
          c.verdict === 'empty' ? 4 : c.verdict === 'mixed' ? 5 : c.verdict === 'skeleton' ? 6 : c.verdict === 'taken' || c.verdict === 'race' ? 7 : 99;
        const rows = [
          ['1', 'NFKC normalization', c.steps.nfkc],
          ['2', 'Strip Cf codepoints', c.steps.cf],
          ['3', 'Whitespace canonicalization', c.steps.ws + '  <em>← display name</em>'],
          ['4', 'Case-fold (uniqueness key only)', c.steps.fold + '  <em>← key</em>'],
          ['5', 'Mixed-script check (UTS #39 MR)', c.verdict === 'mixed' ? 'Latin + Cyrillic → <em>reject</em>' : 'single script → pass'],
          ['6', 'Confusable skeleton (non-unique index)', c.verdict === 'skeleton' ? 'skeleton == “hollow” → <em>reject</em>' : 'no skeleton match'],
          ['7', 'UNIQUE index on normalized key', c.verdict === 'taken' ? '23505 → <em>duplicate</em>' : c.verdict === 'race' ? '23505 at INSERT → <em>duplicate</em>' : 'insert ok'],
        ];
        return rows
          .map(([n, name, val], i) => {
            const idx = i + 1;
            const cls = idx < rejectAt ? 'fired' : idx === rejectAt ? 'rejected' : '';
            return (
              '<div class="step ' + cls + '"><div class="stepno">' + n + '</div>' +
              '<div class="stepbody"><div class="stepname">' + name + '</div>' +
              '<div class="stepval">' + val + '</div></div></div>'
            );
          })
          .join('');
      }

      function render() {
        const c = currentCase();
        const v = VERDICT[c.verdict];
        const isRace = c.verdict === 'race';

        let note;
        if (isRace) {
          note =
            '<b>This case only exists because of variant B.</b> A live availability check says “available”, ' +
            'and then the <code>UNIQUE</code> index refuses the insert because somebody else took it in between. ' +
            'B <b>must</b> handle this — an optimistic “available ✓” that can still fail is worse than no check at all if the ' +
            'failure is not designed. A and C never make the promise, so they never break it.';
        } else if (c.changed) {
          note =
            '<b>The server changed what the player typed.</b> §6.1.1 steps 1–3 produce the <i>display name</i>, so this ' +
            'character will not be called exactly what was submitted. Whether the player is told is the variant question — ' +
            'A tells them only after creation, B and C tell them before.';
        } else if (c.verdict === 'skeleton') {
          note =
            '<b>Disclosure question.</b> “Too easily confused with an existing character” reveals that a similar character ' +
            '<i>exists</i> — the same family of leak as sketch 003’s denial codes. Here it is <b>probably fine</b>: character names ' +
            'are public at the <code>anonymous</code> floor (sketch 007), so the prober learns nothing they could not read off the ' +
            'directory. Worth stating explicitly rather than assuming — and the message must <b>not</b> name the colliding character.';
        } else {
          note =
            'The right-hand column is §6.1’s pipeline in order. <b>Order is part of the specification</b> — normalization runs ' +
            'before every check, so “is it taken” is asked about the <i>normalized key</i>, never the raw input.';
        }
        document.getElementById('topnote').className = 'note' + (isRace || c.verdict === 'skeleton' ? ' warn' : '');
        document.getElementById('topnote').innerHTML = note;

        const showEcho = (VARIANT === 'b' || VARIANT === 'c') && c.display && c.display !== c.input;
        const echo = showEcho
          ? '<div class="echo">Will be created as <b>' + c.display + '</b>' +
            '<br /><span class="k">uniqueness key: ' + c.key + '</span></div>'
            : '';

        const msg =
          VARIANT === 'a' && c.verdict === 'ok'
            ? ''
            : '<div class="msg ' + v.cls + '"><svg width="14" height="14"><use href="#' + v.icon + '"/></svg><span>' + v.text + '</span></div>';

        let controls;
        if (VARIANT === 'c') {
          controls =
            echo +
            (c.verdict === 'ok'
              ? '<label class="chk"><input type="checkbox" checked /><span>I understand this name is <b>reserved</b> once created — ' +
                'it stays reserved even if this character is later retired. You can rename later.</span></label>'
              : '') +
            '<div class="btnrow"><button class="btn">Back</button>' +
            '<button class="btn btn-primary" ' + (c.verdict === 'ok' ? '' : 'disabled') + '>Create character</button></div>';
        } else if (VARIANT === 'b') {
          controls =
            echo +
            '<div class="btnrow"><button class="btn btn-primary" ' + (c.verdict === 'ok' ? '' : 'disabled') + '>Create character</button>' +
            '<button class="btn">Cancel</button></div>';
        } else {
          controls = '<div class="btnrow"><button class="btn btn-primary">Create character</button><button class="btn">Cancel</button></div>';
        }

        const inputCls =
          VARIANT === 'a'
            ? c.verdict === 'ok' ? '' : 'err'
            : c.verdict === 'ok' ? 'ok' : 'err';

        document.getElementById('form').innerHTML =
          '<div class="ccard"><div class="cardtop">' +
          '<div class="cavatar ' + (c.display ? 'live' : '') + '">' +
          (c.display ? c.display.charAt(0) : '<svg width="20" height="20"><use href="#i-plus"/></svg>') + '</div>' +
          '<div><div class="cname">New character</div>' +
          '<div class="cmeta">' + (VARIANT === 'c' ? 'Step 2 of 2 — confirm' : 'You can rename later (IDENT-03).') + '</div></div></div>' +
          '<label class="fl">Character name</label>' +
          '<input class="name ' + inputCls + '" value="' + c.input.replace(/"/g, '&quot;') + '" />' +
          msg + controls +
          '</div>';

        document.getElementById('pipe').innerHTML = pipeHtml(c);
      }

      function showVariant(v, btn) {
        VARIANT = v;
        document.querySelectorAll('.variant-tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      }
      render();
    </script>
  </body>
</html>
