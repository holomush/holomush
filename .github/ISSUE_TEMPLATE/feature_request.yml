# SPDX-License-Identifier: Apache-2.0
name: Feature Request
description: Propose a new feature. Read the full instructions before opening this issue.
labels: ["feature-request", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## Read this before you fill anything out

        Feature proposals are the highest-bar contribution here, so this form is long. Everything
        it asks for is something a reviewer would otherwise have to ask you for.

        A feature adds something new to HoloMUSH — a new command, event type, plugin capability,
        RPC, or client surface. The bar is high because every feature adds permanent maintenance
        burden.

        **Before opening this issue:**
        - Check [Discussions](https://github.com/holomush/holomush/discussions) — has this been proposed and declined before?
        - Read [CONTRIBUTING.md](https://github.com/holomush/holomush/blob/main/CONTRIBUTING.md#feature) — what `approved-feature` means and why you wait for it before writing code.
        - This form asks who benefits. If the honest answer is "me", say so — that is sometimes still a good reason, but the spec has to argue it.

        **What happens after you submit:**
        A maintainer reads the spec. Incomplete ones get closed — we will not fill in the gaps for
        you, so it is worth over-explaining. If it conflicts with HoloMUSH's architecture it gets
        declined, and that is not a comment on the idea. If it is approved you will see the
        `approved-feature` label, and that is your green light to start coding.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checklist
      description: All four are required.
      options:
        - label: I have searched existing issues and discussions — this has not been proposed and declined before
          required: true
        - label: I have read CONTRIBUTING.md and understand that I must wait for `approved-feature` before writing any code
          required: true
        - label: I have reviewed the existing commands, events, and plugin capabilities and confirmed this does not duplicate
            existing behavior
          required: true
        - label: This solves a problem for players, game operators, or plugin developers — not a personal preference or a
            workflow I happen to like
          required: true

  - type: input
    id: feature_name
    attributes:
      label: Feature name
      description: A short, concrete name for this feature (not a sales pitch — just what it is).
      placeholder: "e.g., Scene transcript export, Per-location ambient events, Plugin-owned attribute indexes"
    validations:
      required: true

  - type: dropdown
    id: feature_type
    attributes:
      label: Type of addition
      description: What kind of thing is this feature adding?
      options:
        - New player/operator command
        - New event type or event domain
        - New plugin capability or host function
        - New RPC (core, world, web, or admin service)
        - New web client surface
        - New storage or migration concern
        - New access-control (ABAC) concept
        - Other (describe in spec)
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: The problem this solves
      description: |
        Describe the concrete problem this solves, and for whom (player, game operator, plugin developer,
        or contributor). Be specific.

        Good: "When a scene ends, participants have no way to retrieve what was posed. Operators
        currently have to query `plugin_core_scenes.scene_log` by hand, which requires database access
        that players never have."

        Bad: "It would be nice to have transcripts." / "Other MUSHes have this." / "I need this for my game."
      placeholder: |
        When [specific situation], the [player/operator/plugin developer] cannot [specific thing],
        which causes [specific negative outcome].
    validations:
      required: true

  - type: textarea
    id: what_is_added
    attributes:
      label: What this feature adds
      description: |
        Describe exactly what is being added. Be specific about commands, events, RPCs, output, and
        user interaction. Include example commands or example output where possible.
      placeholder: |
        A new `scene transcript` command that:
        1. Resolves the caller's current scene focus
        2. Queries the plugin's own audit table via `PluginAuditService`
        3. Renders the log as text to the calling connection

        Example usage:
        ```
        > scene transcript
        [2026-07-29 14:02] Kestrel poses: She steps through the archway.
        [2026-07-29 14:03] Ash says: "You're late."
        ```
    validations:
      required: true

  - type: textarea
    id: full_scope
    attributes:
      label: Full scope of changes
      description: |
        List every file, system, and area of the codebase this feature would touch. Be exhaustive.
        This is the hardest field on the form and we do mean exhaustive — an approved spec has to be
        implementable from the issue alone. If you cannot map the change onto the codebase yet, open a
        [Discussion](https://github.com/holomush/holomush/discussions) instead and we will work out
        the scope together.
      placeholder: |
        Files that would be created:
        - `plugins/core-scenes/transcript.go` — command handler

        Files that would be modified:
        - `plugins/core-scenes/plugin.yaml` — declare the new command + capabilities
        - `plugins/core-scenes/store.go` — add the transcript query
        - `plugins/core-scenes/transcript_test.go` — new tests
        - `site/src/content/docs/guide/` — document the command

        Systems affected:
        - Plugin command dispatch (capability check: {read, scene, ScopeLocal})
        - Plugin-owned audit table `plugin_core_scenes.scene_log`
        - No migration required
    validations:
      required: true

  - type: textarea
    id: user_stories
    attributes:
      label: User stories
      description: Write at least two user stories in the format "As a [user], I want [thing] so that [outcome]."
      placeholder: |
        1. As a player, I want to read back a scene I participated in so that I can write a summary afterwards.
        2. As a game operator, I want transcript access to respect scene membership so that private scenes stay private.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: |
        List the specific, testable conditions that must be true for this feature to be complete.
        These become the basis for reviewer sign-off. Vague criteria ("it works") are not acceptable.
      placeholder: |
        - [ ] `scene transcript` returns the log for the caller's focused scene
        - [ ] A character who was never a participant is denied (default-deny ABAC)
        - [ ] The command errors clearly when the caller has no scene focus
        - [ ] Output is paginated for scenes longer than 100 entries
        - [ ] All existing tests still pass
        - [ ] New tests cover the happy path, the denial path, and the no-focus case
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Which area does this primarily affect?
      options:
        - Core server (world model, sessions, presence)
        - Event bus / JetStream (events, audit log)
        - Plugin host (Lua / binary / setting)
        - Access control (ABAC)
        - Store / migrations (PostgreSQL)
        - Telnet gateway
        - Web client (SvelteKit PWA)
        - gRPC / ConnectRPC API (proto)
        - Multiple areas (describe in scope section above)
    validations:
      required: true

  - type: checkboxes
    id: surfaces
    attributes:
      label: Applicable surfaces
      description: Which client surfaces must this work with? Check all that apply.
      options:
        - label: Telnet
        - label: Web client (PWA)
        - label: gRPC / ConnectRPC API
        - label: holomush CLI
        - label: All surfaces
        - label: N/A — server-side only

  - type: textarea
    id: breaking_changes
    attributes:
      label: Breaking changes assessment
      description: |
        Does this feature change existing behavior, command output, event shapes, proto schemas,
        or database schemas? If yes, describe exactly what breaks and how existing deployments
        would migrate. Write "None" only if you are certain.
      placeholder: |
        None — this adds a new command and does not modify any existing command, event shape, or table.

        OR:

        Adds a nullable `transcript_visibility` column to `plugin_core_scenes.scene`. Existing rows
        default to `participants`, preserving current behavior. Paired down-migration drops the column.
    validations:
      required: true

  - type: textarea
    id: maintenance_burden
    attributes:
      label: Maintenance burden
      description: |
        Every feature is code that must be maintained forever. Describe the ongoing cost:
        - How does this interact with future changes to the event bus, plugin host, or world model?
        - Does this add external dependencies?
        - Does it require documentation updates across multiple audiences?
        - Will it create edge cases or interactions with other features?
      placeholder: |
        - No new dependencies
        - The transcript query must be updated if the scene audit schema changes
        - Adds a second read path against plugin-owned audit tables, which must stay consistent
          with the host's ABAC denial semantics
        - Needs docs in both `guide/` (players) and `extending/` (plugin developers)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        What other approaches did you consider? Why did you reject them?
        If you truly considered none, say that — but expect the first review question to be
        "why this way?"
      placeholder: |
        1. Exposing the audit table over a generic query RPC — rejected because it would let any
           plugin read any other plugin's audit rows, breaking plugin isolation.
        2. Emailing transcripts on scene end — rejected because HoloMUSH has no mail transport
           and it moves data outside the ABAC boundary.
    validations:
      required: true

  - type: textarea
    id: prior_art
    attributes:
      label: Prior art and references
      description: |
        Does any other MUSH, project, or HoloMUSH discussion address this? Link to anything relevant.
        If you are aware of a prior declined proposal for this feature, explain why this one is different.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Anything else — screenshots, recordings, related issues, or links.
    validations:
      required: false
