name: Chore / Maintenance
description: Internal improvements — refactoring, test quality, tech debt, and the tooling around them.
labels: ["type: chore", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Internal maintenance work

        Use this template for work that improves the **project's health** without changing
        user-facing behavior. Examples:
        - Test suite refactoring or standardization
        - Refactoring, code quality, or linting changes
        - Tech debt paydown
        - Build system or `Taskfile` tooling updates

        If this changes how HoloMUSH **works** for players, operators, or plugin developers, use
        [Enhancement](https://github.com/holomush/holomush/issues/new?template=enhancement.yml) or
        [Feature Request](https://github.com/holomush/holomush/issues/new?template=feature_request.yml)
        instead.

        > **Already exempt?** Dependency-only, repo-config-only (`.github/**`, but **not**
        > `CODEOWNERS`), and documentation-only PRs bypass the issue-first gate — you can open those
        > directly without filing here, and they do not use a typed PR template. File them here only
        > if you want the work tracked. `Taskfile.yaml` and `scripts/**` are **not** exempt and do
        > belong here. Full path lists:
        > [CONTRIBUTING.md](https://github.com/holomush/holomush/blob/main/CONTRIBUTING.md#exempt-by-file-path).

        **What happens after you submit:**
        A maintainer triages this and applies `approved-chore` once the scope is agreed. The bar
        is lower than a feature or enhancement — this is a scope check, not a design review.

        **Do not open a PR until this issue is labeled `approved-chore`.** Once it is, use the
        [Chore PR template](https://github.com/holomush/holomush/blob/main/.github/PULL_REQUEST_TEMPLATE/chore.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checklist
      options:
        - label: This does not change user-facing behavior (commands, output, event shapes, proto schemas, config)
          required: true
        - label: I have searched existing issues — this has not already been filed
          required: true

  - type: input
    id: chore_title
    attributes:
      label: What is the maintenance task?
      description: A short, concrete description of what needs to happen.
      placeholder: "e.g., Migrate remaining table tests to ACE naming, Add depguard rule for testsupport imports, Bump testcontainers-go"
    validations:
      required: true

  - type: dropdown
    id: chore_type
    attributes:
      label: Type of maintenance
      options:
        - Test quality (coverage, patterns, harness)
        - Refactoring / code quality
        - Tech debt
        - Build system / tooling (Taskfile, scripts)
        - CI/CD pipeline
        - Dependency update
        - Documentation infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current state
      description: |
        Describe the current situation. What is the problem or debt? Include numbers where possible
        (test count, coverage %, build time, dependency age).
      placeholder: |
        41 of 260 test functions use underscore-separated names (`TestEngine_Evaluate`) outside the
        documented `TestType_Method`-with-subtests exception. `.claude/rules/testing.md` requires ACE
        sentence naming, but nothing enforces it, so new tests keep drifting.
    validations:
      required: true

  - type: textarea
    id: proposed_work
    attributes:
      label: Proposed work
      description: |
        What changes will be made? List files, patterns, or systems affected.
      placeholder: |
        - Rename the 41 non-conforming test functions to ACE sentence form
        - Add a `test/meta/` guard asserting no `Test[A-Za-z]+_` outside the subtest exception
        - Verify `task test` and `task test:int` still pass
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Done when
      description: |
        List the specific conditions that mean this work is complete. These should be verifiable.
      placeholder: |
        - [ ] All test functions follow ACE naming or the documented subtest exception
        - [ ] Meta-test fails on a deliberately misnamed fixture (negative control)
        - [ ] `task pr-prep` green
        - [ ] No change to user-facing behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area affected
      options:
        - Test suite
        - CI/CD
        - Build system / Taskfile
        - Core library code
        - Plugins
        - Database / migrations
        - Documentation tooling
        - Multiple areas
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Related issues, prior art, or anything else that helps scope this work.
    validations:
      required: false
