name: CI

# Same-name companion workflow for docs-only PRs. When ci.yaml is path-skipped,
# branch-protection required checks (Build, Lint, Test, Integration Test, E2E
# Test, Vuln) would otherwise stay 'Pending' forever. Job names here are
# byte-identical to ci.yaml's required-check job names so GitHub treats them as
# the same check.
#
# EVERY ci.yaml-sourced context required by protect-main ruleset 11923801 MUST
# have a job here. The ruleset requires eight contexts; CodeRabbit and
# Conventional Commit (PR title) post independently of ci.yaml, so the remaining
# six are this workflow's responsibility. Adding a required check to the ruleset
# without adding its stand-in here silently blocks every docs-only PR — GitHub
# reports BLOCKED with nothing failing to point at (issue #4878; same failure
# mode as the PR #4823 incident in .claude/rules/landing-the-plane.md).
#
# Lint is NOT a no-op: it runs the real docs lint lane (task pr-prep:docs —
# markdown, ADR, docs-symmetry, fmt, license, docs-paths-sync) so markdown/ADR
# violations can no longer land on main unchecked (holomush-3zrvh — the gap that
# let PR #4281's MD038 + missing-ADR-Rationale through). Test/Build/Integration/
# E2E/Vuln stay no-op stand-ins — docs changes don't exercise those.
#
# DOCS_ONLY_PATHS — must remain byte-identical with ci.yaml's paths-ignore
# blocks and Taskfile.yaml's DOCS_ONLY_PATHS var. Enforced by
# `task lint:docs-paths-sync`.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - .planning/**
      - "**/*.md"
      - .claude/agents/**
      - .claude/commands/**
      - .claude/rules/**
      - .claude/agent-memory/**
      - LICENSE
      - LICENSE_HEADER
  pull_request:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - .planning/**
      - "**/*.md"
      - .claude/agents/**
      - .claude/commands/**
      - .claude/rules/**
      - .claude/agent-memory/**
      - LICENSE
      - LICENSE_HEADER

permissions:
  contents: read

jobs:
  Lint:
    name: Lint
    # Real docs lint — mirrors ci.yaml's Lint setup (the same steps already run
    # the full task lint + fmt:check + license:check there), then runs the docs
    # subset via task pr-prep:docs. holomush-3zrvh.
    runs-on: namespace-profile-linux-amd64-2x4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Docs lint reads the repo + public release/proxy downloads only; no
          # git credentials needed post-checkout. Avoids persisting the token in
          # .git/config (zizmor artipacked).
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Install formatters
        # ripgrep + rumdl + dprint — the doc-lint lane needs rumdl (markdown),
        # dprint (fmt:check), and rg (lint:adr / lint:no-* scans inside task lint).
        uses: ./.github/actions/install-formatters

      - name: Lint docs
        run: task pr-prep:docs

  Test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only PR — Test skipped (no code changes)"
  Build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only PR — Build skipped (no code changes)"
  Integration:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only PR — Integration skipped (no code changes)"
  E2E:
    name: E2E Test
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only PR — E2E skipped (no code changes)"
  Vuln:
    name: Vuln
    # No-op is semantically correct here (unlike Lint): the OPS-03 gate scans Go
    # dependencies with govulncheck + osv-scanner, and DOCS_ONLY_PATHS cannot
    # match go.mod / go.sum, so a docs-only PR provably changes no dependency
    # surface. Required by ruleset 11923801; without this job every docs-only PR
    # hangs on a check that never arrives (#4878).
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only PR — Vuln skipped (no dependency changes)"
