name: Buf Proto CI

on:
  pull_request:
    branches: [main]
    paths:
      - "api/proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "buf.lock"
  push:
    branches: [main]
    paths:
      - "api/proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "buf.lock"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Buf Lint
    runs-on: namespace-profile-linux-amd64-2x4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          token: ${{ secrets.BUF_TOKEN }}
          lint: true
          format: true
          breaking: false
          push: false

  push:
    name: Buf Push to BSR
    runs-on: namespace-profile-linux-amd64-2x4
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          token: ${{ secrets.BUF_TOKEN }}
          lint: false
          format: false
          breaking: false
          push: true
